<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1292" role="img" aria-label="CoCoME MERM 视图"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#0f172a" font-size="16"><text x="30" y="42" font-size="26" font-weight="bold">CoCoME · MERM 服务边界与接口视图</text><text x="30" y="74" fill="#475569">真实 JEV 选择 C3 · seed 101 · 4 个服务</text><text x="30" y="108" font-size="14" fill="#475569">框内展示用例和实体；跨服务箭头表示需求接口 → 提供该实体的服务。编号是分组标签，不是业务命名。</text><text x="30" y="148" font-size="15">参与者：Administrator / Cashier / StoreManager；参与者到用例的关联见下方交互明细。</text><g class="edge" data-consumer="0" data-provider="1"><path d="M 279.70000000000005 682 V 1152 H 714.3 V 682" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity=".65"/><text x="30" y="1168" font-size="13" fill="#475569">MS1 → MS2：ProductCatalog</text></g><g class="edge" data-consumer="0" data-provider="3"><path d="M 279.70000000000005 682 V 1172 H 234.3 V 1052" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity=".65"/><text x="30" y="1188" font-size="13" fill="#475569">MS1 → MS4：Cashier</text></g><g class="edge" data-consumer="0" data-provider="1"><path d="M 279.70000000000005 682 V 1192 H 714.3 V 682" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity=".65"/><text x="30" y="1208" font-size="13" fill="#475569">MS1 → MS2：Item</text></g><g class="edge" data-consumer="0" data-provider="2"><path d="M 279.70000000000005 682 V 1212 H 1194.3 V 682" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" opacity=".65"/><text x="30" y="1228" font-size="13" fill="#475569">MS1 → MS3：Supplier</text></g><g class="edge" data-consumer="3" data-provider="0"><path d="M 279.70000000000005 1052 V 1232 H 234.3 V 682" fill="none" stroke="#
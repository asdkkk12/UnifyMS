canvas.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=point(e);drag={x:p.x,y:p.y,tx:transforms[current].x,ty:transforms[current].y,target:e.target};moved=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;transforms[current].x=drag.tx+dx;transforms[current].y=drag.ty+dy;update()});
canvas.addEventListener('pointerup',()=>{if(drag&&!moved){const n=drag.target.closest('[data-id]');if(n){activeNode=nodes.has(n.dataset.id)?n.dataset.id:activeNode;$('selection').textContent=JSON.stringify(nodes.get(n.dataset.id)||edges.get(n.dataset.id),null,2);filter()}}drag=null});canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=e.target.closest('[data-id]');if(n){activeNode=nodes.has(n.dataset.id)?n.dataset.id:activeNode;$('selection').textContent=JSON.stringify(nodes.get(n.dataset.id)||edges.get(n.dataset.id),null,2);filter()}}})});
$('download').onclick=()=>{const copy=$(current).querySelector('svg').cloneNode(true);copy.querySelector('.stage').removeAttribute('transform');const blob=new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=model.name+'-'+current+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
filter();
</script></body></html>
